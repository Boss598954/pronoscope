# Configuration Netlify — PronoScope
# (Netlify = service d'hébergement qui construit et publie automatiquement le site
#  à chaque modification poussée sur GitHub)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Application monopage (SPA) : toutes les adresses renvoient vers index.html
# pour que la navigation directe (/analyse, /calendrier...) fonctionne.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# En-têtes de sécurité et de performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Mise en cache longue durée des assets fingerprintés par Vite
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
